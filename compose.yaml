services:
  api:
    image: api
    build:
      context: .
      dockerfile: rental-service/server/API/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # For Postgres 18+ the recommended mount point is /var/lib/postgresql
      # so the server can use version-specific subdirectories (see docker-library/postgres PRs).
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
